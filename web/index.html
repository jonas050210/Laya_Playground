<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Laya Model Playground</title>
<style>
/* Laya Model Playground — design system
   Dark, dense, instrument-panel aesthetic. No external fonts or assets: the file preview
   sandbox has no network, so everything is inline or a system font. */

:root{
  --bg:#080a0f; --bg2:#0b0e15;
  --panel:#111520; --panel2:#171c29; --panel3:#1d2231;
  --line:#242b3d; --line2:#2f3850;
  --ink:#e9edf7; --dim:#8e98b3; --dim2:#606b87;
  --acc:#6ea8fe; --acc2:#9b7cf6; --ok:#3ddc97; --warn:#ffb454; --bad:#ff6b81;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --r:12px; --r2:9px;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{scrollbar-color:var(--line2) transparent}
body{margin:0;background:
    radial-gradient(1200px 600px at 78% -8%, rgba(110,168,254,.07), transparent 60%),
    radial-gradient(900px 500px at 10% -5%, rgba(155,124,246,.06), transparent 55%),
    var(--bg);
  color:var(--ink);
  font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:rgba(110,168,254,.28)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);background:rgba(11,14,21,.86);
  backdrop-filter:blur(14px);position:sticky;top:0;z-index:40}
.logo{width:32px;height:32px;border-radius:9px;flex:0 0 auto;position:relative;
  background:conic-gradient(from 200deg,var(--acc),var(--acc2),var(--ok),var(--acc));
  box-shadow:0 0 22px -4px rgba(110,168,254,.55)}
.logo::after{content:"";position:absolute;inset:6px;border-radius:4px;background:var(--bg2)}
h1{font-size:15px;margin:0;letter-spacing:.2px;font-weight:650}
.sub{color:var(--dim);font-size:11.5px;margin-top:1px}
.grow{flex:1}
.pill{font:11px/1 var(--mono);padding:7px 11px;border-radius:999px;white-space:nowrap;
  border:1px solid var(--line);background:var(--panel2);color:var(--dim)}
.pill b{color:var(--ink);font-weight:600}
.pill.z b{color:var(--ok)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;
  background:var(--warn);animation:pulse 1.15s ease-in-out infinite;vertical-align:1px}
.dot.ready{background:var(--ok);animation:none;box-shadow:0 0 8px var(--ok)}
.dot.failed{background:var(--bad);animation:none}
@keyframes pulse{50%{opacity:.22}}

/* ---------- nav ---------- */
nav{display:flex;gap:3px;padding:9px 14px;overflow-x:auto;background:var(--bg2);
  border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:35}
nav::-webkit-scrollbar{height:0}
nav .sep{width:1px;background:var(--line);margin:4px 9px;flex:0 0 auto}
nav .grp{font:9px/1 var(--mono);color:var(--dim2);letter-spacing:1.3px;text-transform:uppercase;
  align-self:center;padding:0 9px 0 3px;flex:0 0 auto}
nav button{background:transparent;border:1px solid transparent;color:var(--dim);
  padding:7px 12px;border-radius:var(--r2);cursor:pointer;font-size:12.5px;white-space:nowrap;
  display:flex;align-items:center;gap:7px;transition:.13s;font-family:inherit;flex:0 0 auto}
nav button:hover{color:var(--ink);background:var(--panel2)}
nav button.on{color:var(--ink);background:var(--panel3);border-color:var(--line2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
nav button.on .ic{color:var(--acc)}
nav .ic{font-size:13px;color:var(--dim2)}

main{padding:18px;max-width:1560px;margin:0 auto}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:15px;align-items:start}
.grid.wide{grid-template-columns:minmax(0,1fr)}
@media(max-width:1120px){.grid{grid-template-columns:minmax(0,1fr)}}
.grid>*{min-width:0}
/* ---------- left action rail (3D shooter) ---------- */
.rail{display:grid;grid-template-columns:186px minmax(0,1fr) minmax(0,1fr);gap:15px;align-items:start}
.rail>*{min-width:0}
@media(max-width:1240px){.rail{grid-template-columns:170px minmax(0,1fr)}}
@media(max-width:820px){.rail{grid-template-columns:minmax(0,1fr)}}
.acts{position:sticky;top:12px;display:flex;flex-direction:column;gap:7px}
.acts .grp2{font:600 9px/1 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin:9px 0 1px}
.acts button{width:100%;justify-content:flex-start;text-align:left}
.acts .fld{width:100%}
.acts input[type=range]{width:100%}
.budget{font:700 15px/1.2 ui-monospace,monospace;color:var(--acc)}
.budget small{display:block;font:400 10px/1.4 var(--sans);color:var(--dim);margin-top:3px}

/* ---------- cards ---------- */
.card{background:linear-gradient(180deg,var(--panel),#0f131d);
  border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:15px;
  box-shadow:var(--sh)}
.card.tight{padding:13px}
.card{min-width:0}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.card table{max-width:100%}
@media(max-width:620px){.card>table{display:block;overflow-x:auto}}
@media(max-width:620px){
  table{font-size:11px}
  th,td{padding:5px 6px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(78px,1fr))}
  .bar{grid-template-columns:78px 1fr 48px}
  main{padding:11px}
  .card{padding:12px}
  .row>label.fld{flex:1 1 100%!important;min-width:0!important}
  button.chip{max-width:100%}
  nav{top:0;position:relative}
  header{position:relative}
}
.card h2{margin:0 0 3px;font-size:14.5px;letter-spacing:.2px;font-weight:650;
  display:flex;align-items:center;gap:8px}
.card h2 .tag{font:9.5px/1 var(--mono);color:var(--dim2);border:1px solid var(--line);
  padding:4px 7px;border-radius:5px;letter-spacing:.7px;font-weight:400}
.card h3{margin:15px 0 7px;font-size:10.5px;text-transform:uppercase;
  letter-spacing:1px;color:var(--dim);font-weight:650}
.card h3:first-child{margin-top:0}
p.lede{margin:0 0 12px;color:var(--dim);font-size:12.8px;line-height:1.6}
p.lede b{color:var(--ink);font-weight:600}
p.lede code{color:var(--acc)}
code{font-family:var(--mono);font-size:.92em;background:var(--panel3);
  padding:1px 5px;border-radius:4px;color:var(--acc)}

/* ---------- controls ---------- */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:11px}
button.act{background:linear-gradient(180deg,#7db2ff,#5b97f5);color:#05101f;border:0;
  padding:8px 15px;border-radius:var(--r2);font-weight:650;cursor:pointer;font-size:12.5px;
  font-family:inherit;box-shadow:0 1px 0 rgba(255,255,255,.22) inset}
button.act:hover{filter:brightness(1.08)}
button.act:active{transform:translateY(1px)}
button.act:disabled{opacity:.42;cursor:not-allowed;filter:none}
button.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
  padding:8px 13px;border-radius:var(--r2);cursor:pointer;font-size:12.5px;font-family:inherit}
button.ghost:hover{border-color:var(--line2);background:var(--panel3)}
button.ghost.on{border-color:var(--acc);color:var(--acc);background:rgba(110,168,254,.09)}
button.ghost:disabled{opacity:.42;cursor:not-allowed}
button.chip{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  padding:5px 10px;border-radius:999px;font-size:11.5px;cursor:pointer;font-family:inherit;
  max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
button.chip:hover{color:var(--ink);border-color:var(--acc)}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:10.5px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.7px;font-weight:600;min-width:0;max-width:100%}
.row>*{min-width:0}
input,select,textarea{background:#080b12;border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:7px 10px;font-size:12.5px;font-family:inherit;outline:none;
  max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc);
  box-shadow:0 0 0 3px rgba(110,168,254,.13)}
input[type=number]{width:76px}
input[type=range]{padding:0;width:150px;accent-color:var(--acc);border:0;background:transparent}
textarea{width:100%;font-family:var(--mono);font-size:12px;resize:vertical;line-height:1.5}
.fld .val{color:var(--acc);font-family:var(--mono)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:8px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;
  min-width:0}
.stat .k{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;
  font-weight:650;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.stat .v{font:650 17px/1.25 var(--mono);margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.stat .v.sm{font-size:12.5px}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .acc{color:var(--acc)}
.dimc{color:var(--dim)}

/* ---------- probability bars ---------- */
.bars{display:flex;flex-direction:column;gap:5px;margin-top:7px}
.bar{display:grid;grid-template-columns:130px 1fr 60px;gap:9px;align-items:center;font-size:12px}
.bar .lb{color:var(--dim);font-family:var(--mono);font-size:11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{background:#070a10;border-radius:5px;height:17px;overflow:hidden;
  border:1px solid var(--line);position:relative}
.bar .fl{height:100%;border-radius:4px 0 0 4px;
  background:linear-gradient(90deg,rgba(110,168,254,.85),rgba(155,124,246,.85));
  transition:width .25s cubic-bezier(.4,0,.2,1)}
.bar.top .fl{background:linear-gradient(90deg,var(--ok),#2eb37b)}
.bar.top .lb{color:var(--ink)}
.bar.truth .lb{color:var(--ok);font-weight:600}
.bar .pc{text-align:right;font-family:var(--mono);font-size:11px;color:var(--dim)}
.bar.top .pc{color:var(--ink)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:650;font-size:9.5px;text-transform:uppercase;letter-spacing:.8px}
td.num,th.num{text-align:right;font-family:var(--mono)}
tbody tr:hover td{background:rgba(255,255,255,.022)}
tr.hit td{background:rgba(61,220,151,.06)}
tr.miss td{background:rgba(255,107,129,.07)}
tr.hit:hover td{background:rgba(61,220,151,.1)}
tr.miss:hover td{background:rgba(255,107,129,.11)}
td.wrap{white-space:normal;word-break:break-word}

pre{background:#070a10;border:1px solid var(--line);border-radius:var(--r2);padding:11px;
  overflow:auto;font-size:11px;font-family:var(--mono);color:#aab6d0;max-height:300px;margin:0;
  line-height:1.5}
pre.sm{max-height:170px}

.note{font-size:12px;color:var(--dim);border-left:2px solid var(--acc);
  padding:8px 12px;background:var(--panel2);border-radius:0 8px 8px 0;margin:10px 0;line-height:1.55}
.note b{color:var(--ink)}
.note.warn{border-left-color:var(--warn)}
.note.bad{border-left-color:var(--bad)}
.note.ok{border-left-color:var(--ok)}

canvas{width:100%;height:auto;display:block;border-radius:10px;background:#06080d;
  border:1px solid var(--line)}
.hide{display:none}

/* ---------- action banner ---------- */
.action{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--line);margin:11px 0;font-size:13px}
.action .ico{width:24px;height:24px;border-radius:6px;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:700}
.action.ok .ico{background:rgba(61,220,151,.16);color:var(--ok)}
.action.warn .ico{background:rgba(255,180,84,.16);color:var(--warn)}
.action.bad .ico{background:rgba(255,107,129,.16);color:var(--bad)}
.action.ok{border-color:rgba(61,220,151,.3)}
.action.warn{border-color:rgba(255,180,84,.3)}
.action.bad{border-color:rgba(255,107,129,.3)}
.action .txt{font-family:var(--mono);font-size:12px;line-height:1.45}

/* ---------- aim sectors ---------- */
.sectors{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;aspect-ratio:1.4;margin-top:4px}
.sec{border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--dim);
  position:relative;overflow:hidden;background:#080b12;transition:.25s}
.sec .p{font:650 15px/1 var(--mono);color:var(--ink);position:relative;z-index:2}
.sec .n{position:relative;z-index:2;font-size:9px;letter-spacing:.3px}
.sec .hm{position:absolute;inset:0;opacity:0;transition:.3s;
  background:radial-gradient(circle at 50% 50%,var(--acc),rgba(110,168,254,.25))}
.sec.truth{border-color:var(--ok)}
.sec.pick{box-shadow:inset 0 0 0 2px var(--acc)}
.sec .badge{position:absolute;top:4px;right:6px;font:700 8px/1 var(--mono);z-index:2;letter-spacing:.6px}
.sec.truth .badge{color:var(--ok)}

/* ---------- minesweeper ---------- */
.mg{display:grid;gap:2px;margin-top:6px}
.mc{aspect-ratio:1;border-radius:3px;background:#161b28;display:flex;
  align-items:center;justify-content:center;font:650 11px/1 var(--mono);color:var(--dim)}
.mc.rev{background:#1c2331;color:var(--acc)}
.mc.mine{background:rgba(255,107,129,.32);color:var(--bad)}
.mc.front{outline:1px solid rgba(255,180,84,.6)}
.mc.pick{outline:2px solid var(--acc)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;
  border-bottom:1px solid var(--line);font-size:12px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--dim)}
.kv .v{font-family:var(--mono);text-align:right}

.spark{display:flex;align-items:flex-end;gap:2px;height:32px;margin-top:7px}
.spark i{flex:1;background:var(--acc);border-radius:1px;min-height:2px;opacity:.7}
.spark i.miss{background:var(--bad);opacity:.9}

.foot{color:var(--dim2);font-size:11px;text-align:center;padding:24px 16px;line-height:1.7}
.foot code{background:transparent;color:var(--dim2);padding:0}

.skel{height:13px;border-radius:5px;margin:7px 0;
  background:linear-gradient(90deg,var(--panel2),var(--panel3),var(--panel2));
  background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

.badge2{display:inline-block;font:10px/1 var(--mono);padding:3px 7px;border-radius:5px;
  border:1px solid var(--line);color:var(--dim);letter-spacing:.4px}
.badge2.ok{color:var(--ok);border-color:rgba(61,220,151,.35)}
.badge2.bad{color:var(--bad);border-color:rgba(255,107,129,.35)}
.badge2.warn{color:var(--warn);border-color:rgba(255,180,84,.35)}
.badge2.acc{color:var(--acc);border-color:rgba(110,168,254,.35)}

/* home cards */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px;margin-top:11px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:13px;
  cursor:pointer;transition:.15s;text-align:left;font-family:inherit;color:var(--ink)}
.tile:hover{border-color:var(--acc);background:var(--panel3);transform:translateY(-1px)}
.tile .ti{font-size:17px;margin-bottom:6px;color:var(--acc)}
.tile .tt{font-size:13px;font-weight:650;margin-bottom:3px}
.tile .td{font-size:11.5px;color:var(--dim);line-height:1.5}
.tile .tm{margin-top:8px;font:10px/1 var(--mono);color:var(--dim2)}
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <div>
    <h1>Laya Model Playground</h1>
    <div class="sub">Nine games, the seven official demo workflows, a trading floor and a raw playground — one real 322M non-autoregressive decision model</div>
  </div>
  <div class="grow"></div>
  <div class="pill" id="pStatus"><span class="dot" id="dot"></span><span id="statusTxt">loading…</span></div>
  <div class="pill">model <b id="pModel">—</b></div>
  <div class="pill">last <b id="pLat">—</b></div>
  <div class="pill">calls <b id="pCalls">0</b></div>
  <div class="pill">out tokens <b class="ok">0</b></div>
</header>

<nav id="nav"></nav>
<main id="main"></main>
<div class="foot">
  Laya · Apache-2.0 · Convai Innovations — <span id="footInfo">runtime info loading…</span>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
/* Mount generation. Every view switch bumps it; async callbacks that resolve after their
   view was replaced write into a throwaway object instead of crashing on null.
   Found by hammering hash changes at 120 ms: #triage, #free and #shooter all raced. */
let MOUNT=0;
const mounted=g=>g===MOUNT;
const NOOP=new Proxy({},{get:(t,p)=>p==='classList'?{add(){},remove(){},toggle(){}}
                          :p==='style'?{}:p==='focus'||p==='scrollIntoView'?()=>{}:undefined,
                        set:()=>true});
/* $g(sel, gen): like $ but inert once the view has moved on. */
const $g=(s,g)=>(mounted(g)?($(s)||NOOP):NOOP);
const fmt=(n,d=3)=>Number(n).toFixed(d);
const pct=n=>(n*100).toFixed(1)+'%';
let STATUS={state:'cold'};

async function api(path, body){
  const r=await fetch(path,{method:body===undefined?'GET':'POST',
    headers:{'Content-Type':'application/json'},
    body:body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>({detail:'bad json'}));
  if(!r.ok) throw new Error(j.detail||('HTTP '+r.status));
  return j;
}
function setLat(ms){ $('#pLat').textContent = ms==null?'—':Math.round(ms)+' ms'; }

async function poll(){
  try{
    const s=await api('/api/status'); STATUS=s;
    const d=$('#dot'); d.className='dot'+(s.state==='ready'?' ready':s.state==='failed'?' failed':'');
    $('#statusTxt').textContent = s.state==='ready'?'model resident':s.state==='failed'?'load failed':(s.detail||'loading…');
    $('#pModel').textContent = s.state==='ready' ? 'mmBERT-base 322M' : '—';
    $('#pCalls').textContent = s.totals?s.totals.calls:0;
    $('#footInfo').textContent =
      `${s.repo} · ${s.precision} · ctx ${s.context} · loaded in ${s.load_seconds}s · peak RSS ${s.peak_rss_mb} MB · rope buffers restored ${s.rope_buffers_restored} · ${s.threads} threads`;
    if(s.state==='ready'&&VIEWS[cur]&&VIEWS[cur].onReady&&!VIEWS[cur]._ready){
      /* Guard: onReady fires from the status poll, which can land after the user has
         already switched away. Stamp it with the mount generation. */
      const g=MOUNT, k=cur;
      VIEWS[cur]._ready=true;
      if(mounted(g)&&cur===k) VIEWS[cur].onReady();
    }
  }catch(e){}
  setTimeout(poll, STATUS.state==='ready'?4000:1200);
}

/* ---------- shared widgets ---------- */
function barsHTML(labels, probs, opts={}){
  const top=probs.indexOf(Math.max(...probs));
  return `<div class="bars">`+labels.map((l,i)=>{
    const cls=[ i===top?'top':'', opts.truth===i?'truth':''].join(' ');
    return `<div class="bar ${cls}"><div class="lb" title="${esc(l)}">${esc(l)}</div>
      <div class="tr"><div class="fl" style="width:${(probs[i]*100).toFixed(2)}%"></div></div>
      <div class="pc">${fmt(probs[i],4)}</div></div>`;
  }).join('')+`</div>`;
}
function statHTML(items){
  return `<div class="stats">`+items.map(([k,v,c])=>
    `<div class="stat"><div class="k">${k}</div><div class="v ${c||''}">${v}</div></div>`).join('')+`</div>`;
}
function qStats(s){
  if(!s) return '';
  const rows=[['top',s.top],['top prob',fmt(s.top_prob,4)],['confidence',fmt(s.confidence,4)],
    ['margin',fmt(s.margin,4)],['entropy',fmt(s.entropy_bits,3)+' bits'],
    ['act p',fmt(s.act_probability,4)]];
  if(s.score!==undefined) rows.push(['expected score',fmt(s.score,3)]);
  if(s.noul!==undefined) rows.push(['P(true)',fmt(s.noul,4)]);
  return rows.map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function promptHTML(state,questions,raw){
  return `<h3>What the model actually saw</h3>
    <div class="kv"><span class="k">state string</span><span class="v">${raw?raw.input_tokens:'?'} tokens</span></div>
    <pre>${esc(typeof state==='string'?state:JSON.stringify(state,null,2))}</pre>
    <h3>Typed questions (one forward pass)</h3>
    <pre>${esc(JSON.stringify(questions,null,2))}</pre>
    ${raw?`<h3>Raw model output</h3><pre>${esc(JSON.stringify(raw,null,2))}</pre>`:''}`;
}
function spark(hist){
  if(!hist||!hist.length) return '';
  const max=Math.max(...hist.map(h=>h.latency_ms||1));
  return `<div class="spark">`+hist.slice(-42).map(h=>
    `<i class="${h.hit===false||h.correct===false?'miss':''}" style="height:${Math.max(6,(h.latency_ms/max)*100)}%" title="${Math.round(h.latency_ms)}ms"></i>`).join('')+`</div>`;
}

VIEWS.snake={icon:'▦',name:'Snake',auto:null,render(){return `
<div class="grid"><div>
  <div class="card">
    <h2>Snake</h2>
    <p class="lede">Faithful port of the upstream <code>laya-coreml-snake</code> demo: same compact prompt, same

    <div class="row">
      <label class="fld">width<input type="number" id="sW" value="12" min="4" max="24"></label>
      <label class="fld">height<input type="number" id="sH" value="8" min="4" max="16"></label>
      <label class="fld">seed<input type="number" id="sSeed" value="7"></label>
      <button class="ghost on" id="sGuard">shield on</button>
      <button class="act" id="sNew">new game</button>
      <button class="ghost" id="sStep">step</button>
      <button class="ghost" id="sAuto">auto-play</button>
    </div>
    <canvas id="sCv" width="720" height="480"></canvas>
    <div id="sStats" style="margin-top:12px"></div>
  </div></div><div>
  <div class="card"><h2>This move</h2><div id="sMove"><p class="lede">Start a game.</p></div></div>
  <div class="card" id="sPrompt"></div>
</div></div>`;},
 mount(){
  const _g=MOUNT;
  const cv=$g('#sCv',_g),ctx=cv.getContext('2d');let snap=null,guard=true,busy=false;
  const draw=()=>{
    ctx.fillStyle='#080a10';ctx.fillRect(0,0,cv.width,cv.height);
    if(!snap)return;
    const cw=cv.width/snap.width, ch=cv.height/snap.height;
    ctx.strokeStyle='#151a26';ctx.lineWidth=1;
    for(let x=0;x<=snap.width;x++){ctx.beginPath();ctx.moveTo(x*cw,0);ctx.lineTo(x*cw,cv.height);ctx.stroke();}
    for(let y=0;y<=snap.height;y++){ctx.beginPath();ctx.moveTo(0,y*ch);ctx.lineTo(cv.width,y*ch);ctx.stroke();}
    if(snap.food){ctx.fillStyle='#ff6b81';ctx.beginPath();
      ctx.arc((snap.food[0]+.5)*cw,(snap.food[1]+.5)*ch,Math.min(cw,ch)*.3,0,7);ctx.fill();}
    snap.body.forEach(([x,y],i)=>{
      const t=i/Math.max(1,snap.body.length-1);
      ctx.fillStyle=i===0?'#6ea8fe':`rgba(110,168,254,${(0.85-t*0.55).toFixed(2)})`;
      const pad=Math.min(cw,ch)*.10;
      ctx.beginPath();ctx.roundRect(x*cw+pad,y*ch+pad,cw-pad*2,ch-pad*2,3);ctx.fill();});
  };
  const paint=(d,sess)=>{
    $g('#sStats',_g).innerHTML=statHTML([
      ['score',snap.score],['length',snap.length],['ticks',snap.ticks],
      ['alive',snap.alive?'yes':'no',snap.alive?'ok':'bad'],
      ['interventions',sess?sess.interventions:0,sess&&sess.interventions?'warn':''],
      ['avg ms',sess?sess.avg_ms:'—'],['dec/s',sess?sess.decisions_per_sec:'—']]);
    if(!d)return;
    const m=d.move_stats, labels=m.labels, probs=m.probabilities;
    $g('#sMove',_g).innerHTML=`
      ${statHTML([['proposed',d.proposed],['executed',d.executed,d.intervened?'warn':'ok'],
        ['shield',d.intervened?'INTERVENED':'passed',d.intervened?'warn':'ok'],
        ['planner best',d.planner_best],['open cells',d.open_cells]])}
      <h3>choice · direction</h3>${barsHTML(labels,probs)}
      <h3>noul · safe route available</h3>
      ${barsHTML(['false','true'],d.risk_stats.probabilities)}
      <h3>noul · food reachable</h3>
      ${barsHTML(['false','true'],d.food_stats.probabilities)}
      <h3>move question stats</h3>${qStats(m)}`;
    $g('#sPrompt',_g).innerHTML=promptHTML(d.state,d.questions,d.raw);
  };
  const step=async()=>{
    if(busy)return; busy=true;
    try{const r=await api('/api/game/snake/step',{});
      snap=r.snapshot;draw();setLat(r.decision?r.decision.raw.latency_ms:null);
      paint(r.decision,r.session);
      if(!snap.alive||snap.won){stopAuto();}
    }catch(e){$g('#sMove',_g).innerHTML=`<div class="note bad">${esc(e.message)}</div>`;stopAuto();}
    busy=false;
  };
  const stopAuto=()=>{if(VIEWS.snake.auto){clearInterval(VIEWS.snake.auto);VIEWS.snake.auto=null;
    const b=$g('#sAuto',_g); if(b){b.textContent='auto-play';b.classList.remove('on');}}};
  $g('#sNew',_g).onclick=async()=>{
    stopAuto();
    const r=await api('/api/game/snake/new',{width:+$g('#sW',_g).value,height:+$g('#sH',_g).value,
      seed:+$g('#sSeed',_g).value,guarded:guard});
    snap=r.snapshot;draw();paint(null,null);
    $g('#sStats',_g).innerHTML=statHTML([['score',0],['length',snap.length],['ticks',0],['alive','yes','ok']]);
  };
  $g('#sStep',_g).onclick=step;
  $g('#sGuard',_g).onclick=e=>{guard=!guard;e.target.classList.toggle('on',guard);
    e.target.textContent=guard?'shield on':'shield off';};
  $g('#sAuto',_g).onclick=e=>{
    if(VIEWS.snake.auto){stopAuto();}
    else{e.target.textContent='stop';e.target.classList.add('on');
      VIEWS.snake.auto=setInterval(step,60);}};
  VIEWS.snake.cleanup=stopAuto;
  VIEWS.snake.onReady=()=>{const b=$g('#sNew',_g); if(b) b.click();};
  if(STATUS.state==='ready'){const b=$g('#sNew',_g); if(b) b.click();}
 }};

 mount(){

    $g('#aGrid',_g).innerHTML=SEC.map((s,i)=>{

    grid(null);$g('#aStats',_g).innerHTML='';$g('#aSpark',_g).innerHTML='';

 mount(){

 mount(){
  const _g=MOUNT;

  const draw=()=>{
    if(!snap)return;
    const g=$g('#nGrid',_g);g.style.gridTemplateColumns=`repeat(${snap.width},1fr)`;
    const front=new Set(snap.frontier.map(c=>c.join(',')));
    let h='';
    for(let y=0;y<snap.height;y++)for(let x=0;x<snap.width;x++){
      const v=snap.cells[y][x],k=x+','+y;
      const cls=['mc',v==='M'?'mine':v!=='?'&&v!=='F'?'rev':'',front.has(k)?'front':'',
        pick&&pick[0]===x&&pick[1]===y?'pick':''].join(' ');
      h+=`<div class="${cls}">${v==='?'?'':v==='0'?'':v==='M'?'✳':v}</div>`;}
    g.innerHTML=h;
  };
  const step=async()=>{
    if(busy)return;busy=true;
    try{
      const r=await api('/api/game/mines/step',{phrasing:$g('#nPhr',_g).value,auto_open:true});
      snap=r.snapshot;
      if(r.finished&&!r.decision){stopAuto();draw();busy=false;return;}
      const d=r.decision;pick=d.cell;draw();setLat(d.raw.latency_ms);
      $g('#nStats',_g).innerHTML=statHTML([['revealed',snap.revealed+'/'+snap.total_safe],
        ['board',snap.lost?'BOOM':'alive',snap.lost?'bad':'ok'],
        ['judgements',r.session.calls],
        ['model acc',pct(r.session.accuracy),r.session.accuracy>.7?'ok':'warn']]);
      $g('#nDet',_g).innerHTML=`
        ${statHTML([['cell',d.cell.join(',')],['P(mine)',fmt(d.p_mine,4)],
          ['truth',d.truth_is_mine?'MINE':'safe',d.truth_is_mine?'bad':'ok'],
          ['model right',d.correct?'yes':'no',d.correct?'ok':'bad'],
          ['code verdict',d.code_verdict]])}
        <h3>noul · is this square a mine</h3>${barsHTML(['false','true'],d.mine_stats.probabilities)}
        <h3>noul · are the clues ambiguous</h3>${barsHTML(['false','true'],d.ambiguous_stats.probabilities)}
        <h3>mine question stats</h3>${qStats(d.mine_stats)}
        ${d.phrasing==='bare'?'<div class="note warn">Bare phrasing measured 0.44 — the model answers "no" to nearly everything, so P(mine) barely moves.</div>':''}`;
      $g('#nPrompt',_g).innerHTML=promptHTML(d.state,d.questions,d.raw);
      if(snap.lost)stopAuto();
    }catch(e){$g('#nDet',_g).innerHTML=`<div class="note bad">${esc(e.message)}</div>`;stopAuto();}
    busy=false;
  };
  const stopAuto=()=>{if(VIEWS.mines.auto){clearInterval(VIEWS.mines.auto);VIEWS.mines.auto=null;
    const b=$g('#nAuto',_g);if(b){b.textContent='auto-sweep';b.classList.remove('on');}}};
  $g('#nNew',_g).onclick=async()=>{stopAuto();pick=null;
    const r=await api('/api/game/mines/new',{mines:+$g('#nMines',_g).value,seed:+$g('#nSeed',_g).value});
    snap=r.snapshot;draw();$g('#nStats',_g).innerHTML='';$g('#nDet',_g).innerHTML='<p class="lede">Board ready.</p>';};
  $g('#nStep',_g).onclick=step;
  $g('#nAuto',_g).onclick=e=>{if(VIEWS.mines.auto)stopAuto();
    else{e.target.textContent='stop';e.target.classList.add('on');VIEWS.mines.auto=setInterval(step,700);}};
  VIEWS.mines.cleanup=stopAuto;
  VIEWS.mines.onReady=()=>{const b=$g('#nNew',_g); if(b) b.click();};
  if(STATUS.state==='ready'){const b=$g('#nNew',_g); if(b) b.click();}
 }};

/* ======================================================================================
   Official demo workflows, ported from the Hugging Face Space.
   All seven share one renderer: inputs -> action banner -> risk-sorted rows -> full stats.
   ====================================================================================== */

let WFEX=null;
async function wfExamples(){ if(!WFEX){ try{WFEX=await api('/api/workflow/examples');}catch(e){WFEX={};} } return WFEX; }

function actionClass(a){
  const s=String(a).toUpperCase();
  if(/BLOCK|REMOVE|QUARANTINE|DROP|ESCALATE/.test(s)) return 'bad';
  if(/REVIEW|FLAG|PRIORITY|APPROVAL|SPAM|human/i.test(a)) return 'warn';
  return 'ok';
}
function actionIcon(c){ return c==='bad'?'✕':c==='warn'?'!':'✓'; }

function actionHTML(a){
  const c=actionClass(a);
  return `<div class="action ${c}"><div class="ico">${actionIcon(c)}</div>
    <div><div style="font-size:9.5px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;font-weight:650">code decided</div>
    <div class="txt">${esc(a)}</div></div></div>`;
}

/* risk-sorted answer table — upstream's rows(sort_by_risk=True) */
function rowsHTML(rows){
  return `<table><thead><tr><th>question</th><th>type</th><th>answer</th>
      <th class="num">confidence</th><th class="num">risk</th></tr></thead><tbody>`+
    rows.map(r=>{
      const risky=r.risk>=0.7, mid=r.risk>=0.4&&r.risk<0.7;
      const rk=r.type==='choice'?'<span class="dimc">—</span>':
        `<span class="${risky?'bad':mid?'warn':'dimc'}">${fmt(r.risk,3)}</span>`;
      return `<tr><td><code>${esc(r.question)}</code></td>
        <td><span class="badge2">${r.type}</span></td>
        <td><b>${esc(r.answer)}</b></td>
        <td class="num">${fmt(r.confidence,3)}</td><td class="num">${rk}</td></tr>`;
    }).join('')+`</tbody></table>`;
}

/* every question expanded: bars + all the derived stats */
function answersHTML(raw){
  let h='';
  for(const [qid,a] of Object.entries(raw.answers)){
    h+=`<h3>${esc(qid)} <span class="badge2 ${a.type==='noul'?'acc':''}">${a.type}</span></h3>`;
    h+=barsHTML(a.labels,a.probabilities);
    h+=`<div style="margin-top:6px">`+qStats(a)+`</div>`;
  }
  return h;
}

function wfStats(d,extra){
  const base=[['latency',Math.round(d.latency_ms)+' ms'],
    ['questions',Object.keys(d.raw.answers).length],
    ['in tok',d.input_tokens],['out tok','0','ok'],
    ['passes','1','acc']];
  return statHTML(base.concat(extra||[]));
}

/* generic workflow view factory */
function makeWorkflow(cfg){
  return {icon:cfg.icon,name:cfg.name,group:'work',
    render(){ return `
<div class="grid"><div>
  <div class="card">
    <h2>${esc(cfg.name)} <span class="tag">${esc(cfg.tag)}</span></h2>
    <p class="lede">${cfg.lede}</p>
    ${cfg.form}
    <div class="row" style="margin-bottom:0">
      <button class="act" id="wRun">Run</button>
      <span id="wEx" style="display:flex;gap:6px;flex-wrap:wrap"></span>
    </div>
  </div>
  <div class="card" id="wOut"><p class="lede">Press <b>Run</b>.</p></div>
</div><div>
  <div class="card" id="wSide"><h2>Questions asked</h2>
    <p class="lede">The typed question set is sent in <b>one</b> forward pass.</p>
    <pre class="sm" id="wQ">—</pre></div>
  <div class="card"><h2>Raw response <span class="tag">verbatim</span></h2>
    <pre id="wRaw">—</pre></div>
</div></div>`; },
    async mount(){
      const _g=MOUNT;
      const ex=await wfExamples();
      if(!mounted(_g)) return;
      const list=cfg.examples?cfg.examples(ex):[];
      $g('#wEx',_g).innerHTML=list.map((e,i)=>
        `<button class="chip" data-i="${i}" title="${esc(e.label)}">${esc(e.label)}</button>`).join('');
      $$('#wEx button').forEach(b=>b.onclick=()=>{ list[+b.dataset.i].apply(); run(); });
      const run=async()=>{
        if(!mounted(_g)) return;
        $g('#wOut',_g).innerHTML=`<h2>${esc(cfg.name)}</h2><div class="skel" style="width:60%"></div>
          <div class="skel" style="width:85%"></div><div class="skel" style="width:40%"></div>`;
        $g('#wRun',_g).disabled=true;
        try{
          const d=await api(cfg.endpoint,cfg.payload());
          setLat(d.latency_ms);
          $g('#wOut',_g).innerHTML=cfg.result(d);
          $g('#wQ',_g).textContent=JSON.stringify(d.questions||d.questions_def||{},null,1);
          $g('#wRaw',_g).textContent=JSON.stringify(d,null,1);
        }catch(e){ $g('#wOut',_g).innerHTML=`<div class="note bad">${esc(e.message)}</div>`; }
        $g('#wRun',_g).disabled=false;
      };
      $('#wRun').onclick=run;
      if(cfg.autorun) run();
    }};
}

      <h3>The routing ladder, in order</h3>
      ${(()=>{const T=d.thresholds,dom=(d.domain==='code'||d.domain==='math_or_logic'),
        r1=d.is_sensitive&&d.difficulty>=T.domain_hard, r2=d.difficulty>=T.hard,
        r3=dom&&d.difficulty>=T.domain_hard, r4=d.needs_tools, r5=d.difficulty<T.easy;
        let fired=false;
        const row=(cond,label)=>{const first=cond&&!fired; if(cond)fired=true;
          return `<tr class="${first?'hit':''}"><td>${label}</td><td>${cond?

        return `<table><thead><tr><th>rule</th><th>fires?</th></tr></thead><tbody>`+
          row(r1,`sensitive &gt; 0.7 <b>and</b> difficulty ≥ ${T.domain_hard} → large + human review`)+
          row(r2,`difficulty ≥ ${T.hard} → large`)+
          row(r3,`code / math <b>and</b> difficulty ≥ ${T.domain_hard} → large`)+
          row(r4,`needs tools &gt; 0.6 → large`)+
          row(r5,`difficulty &lt; ${T.easy} <b>and</b> confident → cache`)+
          `<tr class="${fired?'':'hit'}"><td>otherwise → small</td><td>${fired?
            '<span class="dimc">—</span>':'<span class="ok">✓ fallback</span>'}</td></tr>`+
          `</tbody></table>`;})()}
      <div class="note warn"><b>These thresholds are re-fitted, and that is the finding.</b>
      Upstream's ladder tests <code>difficulty ≥ 2.0</code>, but this checkpoint compresses the
      rubric: a genuinely hard refactor scores <b>1.40</b> and "prove √2 is irrational" scores
      <b>1.78</b>, while trivia bottoms out at <b>0.09</b>. With the 2.0 rung, <i>every</i> request
      fell through to the small model — the router silently did nothing. Rescaled to the measured
      range: hard ${d.thresholds.hard}, domain ${d.thresholds.domain_hard}, easy ${d.thresholds.easy}.

      ${answersHTML(d.raw)}`;
  },
  autorun:true});

      which one is attacking, and <b>code takes the argmax and aims</b>.</p>
    <div id="xView"></div>
  </div>
  <div class="card" id="xRank"><h2>Threat ranking</h2>
    <p class="lede">Every contact scored independently, then sorted in code.</p></div>
</div><div>
  <div class="card" id="xStats"><h2>Stats</h2><p class="lede">Press <b>Engage</b>.</p></div>
  <div class="card"><h2>Why it is built this way <span class="tag">measured</span></h2>
    <div id="xWhy"><div class="skel" style="width:70%"></div></div></div>
  <div class="card" id="xLog"><h2>Engagement log</h2><p class="lede">—</p></div>
</div></div>`;},
  async mount(){
    const self=this;
    const W=760,H=430,FOV=62;
    /* Camera rotation. The server aims the weapon by computing yaw/pitch from the target's
       real coordinates; the renderer applies the SAME angles, so the crosshair sits on the
       contact Laya picked instead of drifting to screen centre. */
    let cam={yaw:0,pitch:0};
    const project=c=>{
      const ry=cam.yaw*Math.PI/180, rp=cam.pitch*Math.PI/180;
      const cy=Math.cos(ry), sy=Math.sin(ry);
      const x=c.x*cy - (-c.z)*sy; let zf=c.x*sy + (-c.z)*cy;   // yaw about Y
      const cp=Math.cos(rp), sp=Math.sin(rp);
      const y=c.y*cp - zf*sp;     zf = c.y*sp + zf*cp;         // then pitch about X
      if(zf<=0.6) return null;
      const f=(H/2)/Math.tan(FOV*Math.PI/360);
      return {sx:W/2+(x/zf)*f, sy:H/2-(y/zf)*f, s:Math.max(5,(c.size*f)/zf), z:zf};
    };
    const draw=d=>{
      cam={yaw:d.yaw||0, pitch:d.pitch||0};
      const vis=d.contacts.map(c=>({c,p:project(c)})).filter(o=>o.p)
                  .sort((a,b)=>b.p.z-a.p.z);
      const tgt=vis.find(o=>o.c.targeted);
      const hpPct=Math.max(0,d.hp)/100;
      let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;
        border-radius:10px;border:1px solid var(--line);background:
        linear-gradient(#0a0f1c 0%,#0d1524 55%,#0a1018 55%,#070b12 100%)">`;
      // ground grid (perspective)
      for(let i=1;i<=9;i++){
        const z=i*4.2, f=(H/2)/Math.tan(FOV*Math.PI/360), y=H/2-(-1.9/z)*f;
        svg+=`<line x1="0" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}"
          stroke="#1b2740" stroke-width="1"/>`;
      }
      for(let gx=-5;gx<=5;gx++){
        const f=(H/2)/Math.tan(FOV*Math.PI/360);
        const a={x:W/2+(gx*4/4.2)*f, y:H/2-(-1.9/4.2)*f};
        const b={x:W/2+(gx*4/38)*f, y:H/2-(-1.9/38)*f};
        svg+=`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}"
          y2="${b.y.toFixed(1)}" stroke="#1b2740" stroke-width="1"/>`;
      }
      for(const {c,p} of vis){
        const half=p.s/2, op=c.skipped?0.3:(c.prop?0.62:1);
        const dim=Math.max(0.35,Math.min(1,1.25-p.z/40));
        svg+=`<g opacity="${(op*dim).toFixed(2)}">`;
        if(c.prop){
          svg+=`<rect x="${(p.sx-half).toFixed(1)}" y="${(p.sy-half).toFixed(1)}"
            width="${p.s.toFixed(1)}" height="${p.s.toFixed(1)}" rx="2"
            fill="${c.colour}" stroke="#000" stroke-opacity=".45"/>`;
        }else{
          // simple humanoid block: body + head
          svg+=`<rect x="${(p.sx-half*0.55).toFixed(1)}" y="${(p.sy-half*0.55).toFixed(1)}"
            width="${(p.s*0.55).toFixed(1)}" height="${(p.s*0.95).toFixed(1)}" rx="2.5"
            fill="${c.colour}" stroke="#000" stroke-opacity=".5"/>
            <circle cx="${p.sx.toFixed(1)}" cy="${(p.sy-half*0.78).toFixed(1)}"
            r="${(p.s*0.2).toFixed(1)}" fill="${c.colour}" stroke="#000" stroke-opacity=".5"/>`;
          const hb=Math.max(0,c.hp)/c.max_hp;
          svg+=`<rect x="${(p.sx-half*0.6).toFixed(1)}" y="${(p.sy-half*1.05).toFixed(1)}"
            width="${(p.s*0.6).toFixed(1)}" height="3" fill="#000" opacity=".55" rx="1.5"/>
            <rect x="${(p.sx-half*0.6).toFixed(1)}" y="${(p.sy-half*1.05).toFixed(1)}"
            width="${(p.s*0.6*hb).toFixed(1)}" height="3" rx="1.5"
            fill="${hb>0.5?'#3ddc97':hb>0.25?'#ffb454':'#ff6b81'}"/>`;
        }
        svg+=`</g>`;
        const lbl=c.skipped?`${c.kind} ·`:`${c.kind}${c.rank_value!=null?' '+c.rank_value.toFixed(2):''}`;
        svg+=`<text x="${p.sx.toFixed(1)}" y="${(p.sy+half+11).toFixed(1)}" text-anchor="middle"
          font-family="ui-monospace,monospace" font-size="9"
          fill="${c.targeted?'#6ea8fe':c.skipped?'#4b5568':'#7d8aa6'}">${lbl}</text>`;
        if(c.targeted){
          svg+=`<rect x="${(p.sx-half*0.95).toFixed(1)}" y="${(p.sy-half*1.2).toFixed(1)}"
            width="${(p.s*0.95).toFixed(1)}" height="${(p.s*1.35).toFixed(1)}"
            fill="none" stroke="#6ea8fe" stroke-width="1.6" rx="3"/>`;
        }
      }
      // crosshair locked to the model's pick
      const cx=tgt?tgt.p.sx:W/2, cy=tgt?tgt.p.sy:H/2;
      const hit=d.shot&&d.shot.hit;
      const col=tgt?(hit?'#3ddc97':'#ff6b81'):'#6ea8fe';
      svg+=`<g stroke="#05070c" stroke-width="3.4" fill="none" opacity=".75">
        <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="13"/>
        <line x1="${(cx-22).toFixed(1)}" y1="${cy.toFixed(1)}" x2="${(cx-6).toFixed(1)}" y2="${cy.toFixed(1)}"/>
        <line x1="${(cx+6).toFixed(1)}" y1="${cy.toFixed(1)}" x2="${(cx+22).toFixed(1)}" y2="${cy.toFixed(1)}"/>
        <line x1="${cx.toFixed(1)}" y1="${(cy-22).toFixed(1)}" x2="${cx.toFixed(1)}" y2="${(cy-6).toFixed(1)}"/>
        <line x1="${cx.toFixed(1)}" y1="${(cy+6).toFixed(1)}" x2="${cx.toFixed(1)}" y2="${(cy+22).toFixed(1)}"/>
      </g>
      <g stroke="${col}" stroke-width="1.5" fill="none">
        <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="13" opacity=".85"/>
        <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="1.6" fill="${col}" stroke="none"/>
        <line x1="${(cx-22).toFixed(1)}" y1="${cy.toFixed(1)}" x2="${(cx-6).toFixed(1)}" y2="${cy.toFixed(1)}"/>
        <line x1="${(cx+6).toFixed(1)}" y1="${cy.toFixed(1)}" x2="${(cx+22).toFixed(1)}" y2="${cy.toFixed(1)}"/>
        <line x1="${cx.toFixed(1)}" y1="${(cy-22).toFixed(1)}" x2="${cx.toFixed(1)}" y2="${(cy-6).toFixed(1)}"/>
        <line x1="${cx.toFixed(1)}" y1="${(cy+6).toFixed(1)}" x2="${cx.toFixed(1)}" y2="${(cy+22).toFixed(1)}"/>
      </g>`;
      // HUD
      svg+=`<rect x="14" y="${H-30}" width="180" height="9" rx="4.5" fill="#000" opacity=".5"/>
        <rect x="14" y="${H-30}" width="${(180*hpPct).toFixed(1)}" height="9" rx="4.5"
          fill="${hpPct>0.5?'#3ddc97':hpPct>0.25?'#ffb454':'#ff6b81'}"/>
        <text x="14" y="${H-36}" font-family="ui-monospace,monospace" font-size="10"
          fill="#8e98b3">HP ${d.hp}</text>
        <text x="${W-14}" y="${H-36}" text-anchor="end" font-family="ui-monospace,monospace"
          font-size="10" fill="#8e98b3">SCORE ${d.score} · TICK ${d.tick}</text>`;
      if(!d.alive)
        svg+=`<text x="${W/2}" y="${H/2}" text-anchor="middle" font-family="ui-monospace,monospace"
          font-size="26" fill="#ff6b81">ELIMINATED</text>`;
      svg+=`</svg>`;
      $g('#xView',_g).innerHTML=svg+
        (d.events&&d.events.length?`<div class="note warn" style="margin-top:9px">${
          d.events.map(esc).join(' · ')}</div>`:'');

      const t=d.contacts.find(c=>c.targeted);
      $g('#xRank',_g).innerHTML=`<h2>Threat ranking <span class="tag">${d.questions} questions · 1 pass · ${Math.round(d.latency_ms)} ms</span></h2>`+
        `<div class="tbl"><table><thead><tr><th>contact</th><th class="num">engaging</th>
          <th class="num">hostile</th><th class="num">rank</th><th class="num">truth</th>
          <th class="num">dist</th><th>posture</th>
          <th class="num" title="the score question that did not work">threat</th></tr></thead><tbody>`+
        d.contacts.map(c=>`<tr class="${c.targeted?'hit':c.skipped?'miss':''}">
          <td>${c.targeted?'<b>▸ </b>':''}<code>${esc(c.kind)}</code>${c.prop?' <span class="badge2">prop</span>':''}${c.skipped?' <span class="badge2 warn">not scored</span>':''}</td>
          <td class="num ${c.engaging>=0.5?'bad':'dimc'}">${c.engaging!=null?c.engaging.toFixed(3):'—'}</td>
          <td class="num ${c.hostile>=0.5?'':'dimc'}">${c.hostile!=null?c.hostile.toFixed(3):'—'}</td>
          <td class="num"><b>${c.rank_value!=null?c.rank_value.toFixed(3):'—'}</b></td>
          <td class="num ${c.truth_value>0?'ok':'dimc'}">${c.truth_value!=null?c.truth_value.toFixed(0):'—'}</td>
          <td class="num">${c.dist}</td><td><span class="badge2">${esc(c.state)}</span></td>
          <td class="num dimc">${c.threat!=null?c.threat.toFixed(2):'—'}</td>
        </tr>`).join('')+`</tbody></table></div>`+
        `<div class="note"><b>truth</b> = damage this contact would deal over the next 10 ticks,
          measured by re-simulating the arena with and without it (48 paired rollouts). Code
          computes it after the shot purely to grade the model. The greyed-out <b>threat</b>
          column is the score question that <i>looks</i> right and ranks barely above random —
          left visible on purpose.</div>`+
        (t?`<h3>What the model read for the chosen target</h3>
            <pre class="sm">${esc(t.description)}</pre>`:'');

      const s=d.stats;
      $g('#xStats',_g).innerHTML=`<h2>Stats</h2>`+
        statHTML([['score',s.score,'ok'],['hp',d.hp,d.hp>50?'ok':d.hp>25?'warn':'bad'],
          ['ticks',s.ticks],['shots',s.shots],['hits',s.hits],
          ['hit rate',(s.accuracy*100).toFixed(0)+'%'],
          ['kills',s.kills],
          ['priority acc',s.priority_accuracy!=null?(s.priority_accuracy*100).toFixed(0)+'%':'—',
            s.priority_accuracy>=0.5?'ok':'warn'],
          ['value captured',s.value_captured!=null?(s.value_captured*100).toFixed(0)+'%':'—',
            s.value_captured>=0.7?'ok':'warn'],
          ['wasted shots',s.wasted_shots,s.wasted_shots?'bad':'ok'],
          ['damage taken',s.damage_taken,'warn'],
          ['scored / tick',s.budget_ms?`${s.seen} of ${s.seen+s.skipped}`:'all',
            s.skipped?'warn':'ok'],
          ['missed by deadline',s.missed_by_deadline,s.missed_by_deadline?'bad':'ok'],
          ['graded ticks',`${s.graded_ticks}${s.trivial_ticks?` (+${s.trivial_ticks} trivial)`:''}`]])+
        (s.trivial_ticks?`<div class="note"><b>${s.trivial_ticks} tick${s.trivial_ticks>1?'s':''}
          excluded.</b> In those the arena held nothing that could damage the player, so every
          possible pick scores 1.0. Counting them would inflate the average for free, so they are
          reported separately instead of quietly averaged in.</div>`:'')+
        (s.budget_ms?`<div class="note warn"><b>Deadline ${s.budget_ms} ms.</b> Laya scored
          ${s.seen} of ${s.seen+s.skipped} contacts this tick; the rest were triaged out by code
          (nearest first) and greyed out above. <b>missed by deadline</b> counts the ticks where
          the genuinely best target was one it never got to look at — that is the cost of the
          budget, and it is counted against the model, not hidden.</div>`:'')+
        `<div class="note"><b>value captured</b> is the honest score: of the damage the best
         possible target would have prevented, how much did Laya's pick prevent? Partial credit,
         so near-misses count. <b>priority acc</b> is the strict top-1 version. <b>hit rate</b> is
         just the shot resolver and says nothing about the model.</div>`;

      $g('#xLog',_g).innerHTML=`<h2>Engagement log</h2>`+(d.log.length?
        `<div class="tbl"><table><thead><tr><th>t</th><th>target</th><th class="num">threat</th>
          <th class="num">dist</th><th>result</th></tr></thead><tbody>`+
        d.log.map(l=>`<tr class="${l.prop?'miss':''}"><td class="num">${l.tick}</td>
          <td><code>${esc(l.kind)}</code>${l.prop?' <span class="badge2 bad">prop</span>':''}</td>
          <td class="num">${l.threat.toFixed(2)}</td><td class="num">${l.dist}</td>
          <td><span class="badge2 ${l.result==='eliminated'?'ok':l.result==='missed'?'warn':l.result==='destroyed'?'bad':''}">${l.result}</span></td>
        </tr>`).join('')+`</tbody></table></div>`:'<p class="lede">—</p>');
    };
    const _g=MOUNT;
    const live=()=>mounted(_g)&&!!$g('#xView',_g);   // view still mounted?
    const go=async(steps,reset)=>{
      if(!live()) return;
      $g('#xStep',_g).disabled=true;
      const seed=+$g('#xSeed',_g).value, diff=$g('#xDiff',_g).value;
      try{ const d=await api('/api/shooter/step',{seed,difficulty:diff,steps:steps||1,
             reset:!!reset,budget_ms:budget()});
           if(live()) draw(d); }
      catch(e){ if(live()) $g('#xView',_g).innerHTML=`<div class="note bad">${esc(e.message)}</div>`; }
      if(live()) $g('#xStep',_g).disabled=false; else self.cleanup();
    };
    /* Coerce hard: a range input can read '' during teardown, and '' is not a float —
       FastAPI answered 422. Anything non-positive or NaN means "no deadline". */
    const budget=()=>{const v=parseFloat($g('#xBud',_g).value); return v>0?v:null;};
    const showBud=()=>{
      const v=budget(), n=v?Math.max(1,Math.floor(v/230)):null;
      $g('#xBudLbl',_g).textContent = v?`${v} ms`:'no limit';
      $g('#xBudNote',_g).innerHTML = v
        ? `At ~230 ms per contact that is <b>${n}</b> contact${n>1?'s':''} per tick.
           Code triages <b>nearest first</b>; the rest are never scored.`
        : 'Laya gets as long as it needs.';
    };
    $g('#xBud',_g).oninput=showBud; showBud();
    $g('#xStep',_g).onclick=()=>go(1,false);
    $g('#xRun5',_g).onclick=()=>go(5,false);
    $g('#xReset',_g).onclick=()=>{self.cleanup();$g('#xAuto',_g).classList.remove('on');go(1,true);};
    $g('#xAuto',_g).onclick=()=>{const b=$g('#xAuto',_g);
      if(self.timer){self.cleanup();b.classList.remove('on');}
      else{b.classList.add('on');self.timer=setInterval(()=>{ if(live()) go(1,false); else self.cleanup(); },2400);}};
    try{
      const m=(await api('/api/shooter/measured')).measured;
      if(!mounted(_g)) return;
      $g('#xWhy',_g).innerHTML=`
        <p class="lede">Two designs were tried and thrown away before this one. Both looked
        reasonable; both were measured.</p>
        <div class="tbl"><table><thead><tr><th>design</th><th class="num">top-1</th>
          <th class="num">value</th></tr></thead><tbody>
          <tr class="miss"><td>all contacts as one <code>choice</code></td>
            <td class="num bad">${m.listing_choice.score}</td><td class="num dimc">—</td></tr>
          <tr class="miss"><td>per-contact <code>score</code> &ldquo;how urgent?&rdquo;</td>
            <td class="num bad">${m.threat_score.score}</td>
            <td class="num dimc">${m.value.threat}</td></tr>
          <tr class="hit"><td>per-contact <code>choice</code> &ldquo;attacking now?&rdquo;</td>
            <td class="num ok">${m.engaging_choice.score}</td>
            <td class="num ok">${m.value.engaging}</td></tr>
          <tr><td class="dimc">random baseline</td><td class="num dimc">${m.random.score}</td>
            <td class="num dimc">${m.value.random}</td></tr>
        </tbody></table></div>
        <div class="note bad"><b>1. Listing everything in one question was position bias.</b>
        Rotating the same threat through all three option slots changed the answer every time,
        and a <b>wooden crate</b> once outranked a rusher firing at the player.</div>
        <div class="note bad"><b>2. The urgency <i>score</i> question is nearly dead.</b>
        ${esc(m.threat_score.note)}. A fleeing scout close by scored 1.95 while a turret
        shooting from range scored 1.23 — it reads the distance word and little else.</div>
        <div class="note ok"><b>3. One sharp yes/no question works.</b> Asking only
        &ldquo;is it attacking or about to?&rdquo;, once per contact, batched into a single pass,
        with the argmax taken in Python. ${esc(m.holdout)}.</div>
        <div class="note ok"><b>Live check:</b> ${esc(m.live.note)} —
        priority <b>${m.live.priority}</b>, value captured <b>${m.live.value}</b>.</div>
        <div class="note"><b>Ground truth:</b> ${esc(m.truth)} — so &ldquo;correct&rdquo; means
        &ldquo;prevented the most damage&rdquo;, not &ldquo;matched a rule I wrote to agree
        with myself&rdquo;.</div>`;
    }catch(e){ $g('#xWhy',_g).innerHTML=`<div class="note bad">could not load measurements: ${esc(e.message)}</div>`; }
    go(1,true);
  }};


/* ---------- Aim Cascade ---------- */
VIEWS.cascade={icon:'⊞',name:'Aim Cascade',group:'games',timer:null,
  cleanup(){ if(this.timer){clearInterval(this.timer);this.timer=null;} },
  render(){return `
<div class="rail"><div class="acts">
  <div class="grp2">actions</div>
  <button class="act" id="kRound">Scan</button>
  <button class="ghost" id="kRun5">Run 5</button>
  <button class="ghost" id="kAuto">auto</button>
  <button class="ghost" id="kReset">reset</button>
  <div class="grp2">grid</div>
  <label class="fld">size<select id="kSize">
    <option value="4">4 × 4 — 16 cells</option>
    <option value="6" selected>6 × 6 — 36 cells</option>
    <option value="8">8 × 8 — 64 cells</option></select></label>
  <label class="fld">decoys<input type="number" id="kD" value="3" min="0" max="8"></label>
  <label class="fld">seed<input type="number" id="kSeed" value="0"></label>
  <div class="grp2">strategy</div>
  <label class="fld"><select id="kMode">
    <option value="1" selected>cascade — blocks, then cells</option>
    <option value="0">flat — every cell at once</option></select></label>
  <div class="note" style="margin:0;font-size:11px" id="kNote">—</div>
</div><div>
  <div class="card">
    <h2>Aim Cascade <span class="tag">large grids</span></h2>
    <p class="lede">The Aim Trainer at sizes where one <code>choice</code> question collapses.
      At 36 cells a single 36-option question scores <b>0.000</b> — the prompt head is capped
      at 256 tokens and the options are cut off. Asking <b>one yes/no per region</b> and taking
      the argmax in code scores <b>1.000</b>. The cascade is then pure speed: coarse pass over

    <div id="kGrid"></div>
    <div id="kStats" style="margin-top:12px"></div>
  </div>
  <div class="card" id="kStage"><h2>Stage breakdown</h2><p class="lede">Press <b>Scan</b>.</p></div>
</div><div>
  <div class="card"><h2>Why not one big question <span class="tag">measured</span></h2>
    <div id="kWhy"></div></div>
  <div class="card" id="kPrompt"><h2>What the model sees</h2>

</div></div>`;},
  async mount(){
    const self=this, _g=MOUNT;
    const live=()=>mounted(_g)&&!!$('#kGrid');
    $g('#kWhy',_g).innerHTML=`
      <div class="tbl"><table><thead><tr><th>design at 6×6</th><th class="num">acc</th>
        <th class="num">questions</th></tr></thead><tbody>
        <tr class="miss"><td>one <code>choice</code>, all 36 cells</td>
          <td class="num bad">0.000</td><td class="num">1</td></tr>
        <tr class="miss"><td>cascade of <code>choice</code> (9 → 4)</td>
          <td class="num bad">0.286</td><td class="num">2</td></tr>
        <tr class="hit"><td>yes/no per region, argmax in code</td>
          <td class="num ok">1.000</td><td class="num">36</td></tr>
        <tr class="hit"><td><b>cascade of yes/no (9 → 4)</b></td>
          <td class="num ok">1.000</td><td class="num"><b>13</b></td></tr>
      </tbody></table></div>
      <div class="note bad"><b>Two different failures.</b> The flat 36-option prompt dies of
        <b>truncation</b>. Replacing it with a 9-option then 4-option cascade does not help,
        because nine options in one question is already enough for <b>position bias</b> —
        rotating the same target through all nine slots scored 5/9 and the picks clustered
        on slots 0, 6 and 8.</div>
      <div class="note ok"><b>One state per region fixes both.</b> P(yes) is 0.969 for the
        target, 0.108 for a decoy, 0.023 for empty — separation <b>+0.861</b>. The cascade on
        top is only a latency trick: 13 questions instead of 36 for the same 1.000.</div>`;

    const draw=d=>{
      const n=d.size, cells=d.heatmap, mx=Math.max(...cells,0.001);
      let g=`<div style="display:grid;grid-template-columns:repeat(${n},1fr);gap:4px;
        aspect-ratio:1;margin-top:6px">`;
      for(let i=0;i<d.n_cells;i++){
        const v=Math.pow(cells[i]/mx,0.65), isT=i===d.truth, isP=i===d.predicted,
              isD=d.decoys.includes(i),
              inBlk=d.stage&&d.stage.cells.includes(i);
        g+=`<div title="P(target)=${cells[i].toFixed(3)}" style="
          position:relative;border-radius:5px;display:grid;place-items:center;
          background:rgba(110,168,254,${(0.06+v*0.85).toFixed(3)});
          border:1px solid ${isP?'#6ea8fe':inBlk?'#2c3b57':'var(--line)'};
          ${isP?'box-shadow:0 0 0 2px rgba(110,168,254,.35)':''};
          font:600 10px/1 ui-monospace,monospace;color:${v>0.5?'#dce6f7':'#5b6781'}">
          ${isT?'<span style="color:#3ddc97;font-size:13px">◉</span>':isD?'<span style="color:#ffb454">○</span>':''}
        </div>`;
      }
      g+=`</div>`;
      $g('#kGrid',_g).innerHTML=g+
        `<div class="note" style="margin-top:9px"><span style="color:#3ddc97">◉</span> real target ·
          <span style="color:#ffb454">○</span> decoy · blue fill = P(target) from the model ·
          blue outline = where it shot. In cascade mode the dim cells carry their
          <b>block's</b> coarse score; only the winning block was scanned cell by cell.</div>`;

      $g('#kStats',_g).innerHTML=statHTML([
        ['round',d.rounds],['cells',d.n_cells],
        ['hit',d.hit?'yes':'no',d.hit?'ok':'bad'],
        ['accuracy',(d.accuracy*100).toFixed(0)+'%',d.accuracy>=0.9?'ok':'warn'],
        ['questions',d.questions],['passes',d.passes],
        ['latency',Math.round(d.latency_ms)+' ms'],
        ['vs flat',d.cascade?`${d.n_cells} → ${d.questions} q`:'—','ok']]);

      if(d.stage){
        const BL=['top-left','top-centre','top-right','middle-left','centre','middle-right',
                  'bottom-left','bottom-centre','bottom-right'];
        $g('#kStage',_g).innerHTML=`<h2>Stage breakdown</h2>
          <h3>Stage 1 — which block? <span class="tag">${d.stage.blocks.length} questions</span></h3>
          ${barsHTML(BL,d.stage.blocks)}
          <div class="note ${d.stage.stage1_correct?'ok':'bad'}">Picked
            <b>${esc(BL[d.stage.picked_block])}</b> —
            ${d.stage.stage1_correct?'correct':'wrong, so stage 2 cannot recover'}.
            Stage-1 accuracy so far <b>${(d.stage1_accuracy*100).toFixed(0)}%</b>.</div>
          <h3>Stage 2 — which cell inside it? <span class="tag">4 questions</span></h3>
          ${barsHTML(d.stage.cells.map((c,i)=>'quadrant '+(i+1)),d.stage.cell_scores)}`;
      } else {
        $g('#kStage',_g).innerHTML=`<h2>Stage breakdown</h2>
          <div class="note">Flat mode: every cell asked independently in one batched pass —
          ${d.questions} questions, no cascade.</div>`;
      }
      $g('#kPrompt',_g).innerHTML=`<h2>What the model sees</h2>
        <p class="lede">One region per state. It never sees the grid, an index or a coordinate.</p>
        <pre class="sm">${esc(JSON.stringify(d.example_state,null,1))}</pre>
        <h3>the question, asked once per region</h3>
        <pre class="sm">${esc(JSON.stringify(d.questions_def,null,1))}</pre>`;
    };
    const go=async(reset)=>{
      if(!live()) return;
      $g('#kRound',_g).disabled=true;
      try{
        const d=await api('/api/game/aimcascade/round',{
          seed:+$g('#kSeed',_g).value, size:+$g('#kSize',_g).value,
          decoys:+$g('#kD',_g).value, cascade:$g('#kMode',_g).value==='1', reset:!!reset});
        if(live()) draw(d);
      }catch(e){ if(live()) $g('#kGrid',_g).innerHTML=`<div class="note bad">${esc(e.message)}</div>`; }
      if(live()) $g('#kRound',_g).disabled=false; else self.cleanup();
    };
    const note=()=>{
      const n=+$g('#kSize',_g).value, casc=$g('#kMode',_g).value==='1';
      const cells=n*n, q=casc?((n/2)*(n/2)+4):cells;
      $g('#kNote',_g).innerHTML=casc
        ? `${cells} cells → <b>${q}</b> questions (${(n/2)*(n/2)} blocks + 4 cells), 2 passes.`
        : `${cells} cells → <b>${cells}</b> questions, 1 batched pass.`;
    };
    $g('#kSize',_g).onchange=()=>{note();go(true);};
    $g('#kMode',_g).onchange=()=>{note();go(true);};
    $g('#kD',_g).onchange=()=>go(true);
    $g('#kRound',_g).onclick=()=>go(false);
    $g('#kRun5',_g).onclick=async()=>{for(let i=0;i<5&&live();i++) await go(false);};
    $g('#kReset',_g).onclick=()=>{self.cleanup();$g('#kAuto',_g).classList.remove('on');go(true);};
    $g('#kAuto',_g).onclick=()=>{const b=$g('#kAuto',_g);
      if(self.timer){self.cleanup();b.classList.remove('on');}
      else{b.classList.add('on');self.timer=setInterval(()=>{ if(live()) go(false); else self.cleanup(); },2600);}};
    note();
    VIEWS.cascade.onReady=()=>{const b=$('#kRound'); if(b) go(true);};
    if(STATUS.state==='ready') go(true);
  }};

/* ---------- router ---------- */
const GROUPS=[
  {label:'', keys:['about']},
  {label:'games', keys:['snake','aim','cascade','shooter','maze','mines','guard','triage','calib']},
  {label:'official demo', keys:['wtriage','wemail','wguard','wrag','wmod','wrouter','wlang']},
  {label:'markets', keys:['market']},
  {label:'raw', keys:['free']},
];
const ORDER=GROUPS.flatMap(g=>g.keys);
let cur='about';
function nav(){
  $('#nav').innerHTML=GROUPS.map((g,gi)=>
    (gi?`<div class="sep"></div>`:'')+(g.label?`<div class="grp">${g.label}</div>`:'')+
    g.keys.map(k=>{const v=VIEWS[k];
      return `<button data-k="${k}" class="${k===cur?'on':''}" title="${v.name}">
        <span class="ic">${v.icon}</span>${v.name}</button>`;}).join('')
  ).join('');
  $$('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.k));
  const on=$('#nav button.on'); if(on&&on.scrollIntoView) on.scrollIntoView({block:'nearest',inline:'nearest'});
}
function show(k){
  MOUNT++;
  if(VIEWS[cur]&&VIEWS[cur].cleanup)VIEWS[cur].cleanup();
  cur=k;nav();
  if(location.hash.slice(1)!==k) history.replaceState(null,'','#'+k);
  $('#main').innerHTML=VIEWS[k].render();
  VIEWS[k]._ready=false;
  if(VIEWS[k].mount)VIEWS[k].mount();
  if(STATUS.state==='ready')VIEWS[k]._ready=true;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{
  const k=location.hash.slice(1); if(VIEWS[k]&&k!==cur) show(k);
});
const start=location.hash.slice(1);
nav();show(VIEWS[start]?start:'about');poll();
</script>
</body>
